<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Search Engine</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
        }

        .search-container {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.9);
            outline: none;
        }

        .anime-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s;
            border: 1px solid #2575fc;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            background: #0f3460;
        }

        .anime-title {
            color: #e94560;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .anime-info {
            color: #8d93ab;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .download-btn {
            background: #2575fc;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #6a11cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search anime...">
    </div>
    <div id="animeResults" class="anime-results"></div>

    <script>
        // Anime data (hidden in home screen)
        const animeData = Array.from({length: 100}, (_, i) => ({
            id: i + 1,
            title: `Anime ${i + 1}`,
            genre: ['Action', 'Romance', 'Fantasy', 'Sci-Fi'][i % 4],
            year: 2010 + (i % 14),
            rating: (Math.random() * 5 + 5).toFixed(1),
            download: `https://example.com/download/${i + 1}`
        }));

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('animeResults');

        function displayResults(results) {
            resultsContainer.innerHTML = '';
            results.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="anime-title">${anime.title}</div>
                    <div class="anime-info">
                        Genre: ${anime.genre}<br>
                        Year: ${anime.year}<br>
                        Rating: ⭐${anime.rating}
                    </div>
                    <button class="download-btn" onclick="window.open('${anime.download}', '_blank')">
                        Download
                    </button>
                `;
                resultsContainer.appendChild(card);
            });
        }

        function searchAnime() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = animeData.filter(anime => 
                anime.title.toLowerCase().includes(searchTerm) ||
                anime.genre.toLowerCase().includes(searchTerm)
            );
            displayResults(filtered);
        }

        // Event listeners
        searchInput.addEventListener('keyup', searchAnime);
        
        // Initial empty state
        displayResults([]);
    </script>
</body>
</html>
